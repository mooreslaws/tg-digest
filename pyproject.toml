[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-digest"
version = "0.2.0"
description = "Daily Telegram channel digest with OpenAI summarisation and pluggable Markdown output adapters (Notion, Obsidian, Logseq, Hugo, files, stdout, custom)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexey Vorobey" }]
keywords = [
    "telegram",
    "digest",
    "summary",
    "openai",
    "notion",
    "telethon",
    "newsletter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "telethon>=1.36",
    "PyYAML>=6.0",
]

[project.urls]
Source = "https://github.com/mooreslaws/tg-digest"
Issues = "https://github.com/mooreslaws/tg-digest/issues"

[project.scripts]
tg-digest = "tg_digest.digest:main"
tg-digest-auth = "tg_digest.auth:main"
tg-digest-channels = "tg_digest.channels:main"

[tool.setuptools.packages.find]
include = ["tg_digest*"]

[tool.setuptools.package-data]
# Bundle Markdown prompt templates so they're importable from the installed wheel.
tg_digest = ["prompts/*.md"]
